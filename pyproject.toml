[project]
name = "photo-sort"
version = "0.1.0"
description = "Find duplicate and low-quality photos across sources (Google Drive, pen drives, local folders), review, and clean up."
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10.0",          # open/resize images, read EXIF
    "ImageHash>=4.3",        # perceptual hashes (pHash / dHash)
    "numpy>=1.26",           # hash math, clustering
    "scikit-image>=0.22",    # SSIM: confirms phash candidates are really the same shot
    "typer>=0.12",           # CLI
    "rich>=13.0",            # progress bars / tables in the terminal
    "platformdirs>=4.0",     # per-user cache/config locations
    # Google Drive source
    "google-api-python-client>=2.140",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
    # local review web page
    "fastapi>=0.111",
    "uvicorn>=0.30",
]

[project.scripts]
photo-sort = "photo_sort.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["photo_sort"]
